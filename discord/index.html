<!doctype html>
<html lang="en-AU">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AussieTV for Discord</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><h1>AussieTV <small>Discord preview</small></h1><p>Australian live television guide</p></header>
<main>
<div class="toolbar"><label>Region <select id="region"><option>Melbourne</option><option>Sydney</option><option>Brisbane</option><option>Adelaide</option><option>Perth</option><option>Hobart</option><option>Canberra</option><option>Darwin</option></select></label><button id="refresh">Refresh</button></div>
<p id="status" role="status" aria-live="polite">Loading guide…</p>
<section id="guide" aria-label="TV channels"></section>
</main>
<footer>Listings: i.mjh.nz. Playback opens the broadcaster's own website; availability depends on region and account. No video is rebroadcast through Discord.</footer>
<script type="module" src="./app.js"></script>
</body></html>
