name: Docker feed smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aussietv-feed:test .
      - name: Start feed-only service
        run: |
          docker run -d --name aussietv-feed-test -p 127.0.0.1:45782:45782 \
            -e AUSSIETV_JELLYFIN_BASE_URL=http://127.0.0.1:45782 \
            -e AUSSIETV_JELLYFIN_KEY=ci-test-only-local-secret-token-1234567 \
            aussietv-feed:test
      - name: Check feed authentication and isolation
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:45782/jellyfin/health?key=ci-test-only-local-secret-token-1234567'; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:45782/jellyfin/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:45782/api/quit?key=ci-test-only-local-secret-token-1234567')" = 404
      - name: Logs on failure
        if: failure()
        run: docker logs aussietv-feed-test || true
